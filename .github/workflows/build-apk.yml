name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 显式设置 Java 版本为 17，解决版本不兼容问题
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. 设置 Flutter 环境
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # 3. 生成缺失的 android 目录
      - run: flutter create . --project-name physics_lab

      # 4. 清理并获取依赖
      - run: flutter pub get

      # 5. 开始构建 APK
      - run: flutter build apk --release

      # 6. 上传构建好的 APK
      - uses: actions/upload-artifact@v4
        with:
          name: physics-lab-apk
          path: build/app/outputs/flutter-apk/app-release.apk
